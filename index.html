<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2026</title>

	<style>
	@import url('https://fonts.googleapis.com/css2?family=Cookie&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
	
* {
	margin: 0;
	padding: 0;
	font-family: "Cookie", cursive;
}

body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url('https://cdn.vectorstock.com/i/500p/76/20/pastel-purple-watercolor-texture-vector-54447620.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
}

		.container {
			position: absolute;
			top: 100px; /* adjust this value */
			left: 50%;
			transform: translateX(-50%);
			background: rgba(255, 246, 238, 0.9);
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
			text-align: center;
			max-width: 500px;
			width: 90%;
			z-index: 1;
		}

		h1 {
			font-size: 50px;
			font-weight: bold;
		}

		.your-text {
			font-size: 30px;
			color: #363737;
			margin: 20px 0;
		}

		.center {
			margin: 20px 0;
		}

		.clickMe {
			padding: 10px 25px;
			margin: 5px;
			border: none;
			background: #fff;
			color: black;
			cursor: pointer;
			font-size: 20px;
			border-radius: 5px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
			transition: background 0.3s ease;
			font-weight: bold;
		}

		.clickMe:hover {
			background: #c5b4e3;
		}


		/* --- FALLING HEARTS --- */
		.heart {
			position: fixed;
			top: -10px;
			color: white;
			font-size: 20px;
			animation: fall linear forwards;
			pointer-events: none;
			z-index: 0;
		}

		@keyframes fall {
			to {
				transform: translateY(100vh);
				opacity: 0;
			}
		}
.rose {
  width: 200px;
  height: 200px;
  position: fixed; /* Keeps it in place relative to the window */
  right: 50px;     /* Distance from the right edge */
  top: 40%;       /* Centers it vertically */
  z-index: 2;     /* Ensures it stays above background elements */
  animation: yidon 15s infinite;
}

			
.petal {
	width: 50px;
	height: 50px;
	background: #C8A8E9;
	border-radius: 0px 50%;
	position: absolute;
	box-shadow: 0 0 10px #414a4c;
	z-index: 2;
	transform-origin: bottom right; 
	animation: zhankai2 10s infinite;
				
}
			
.petal:nth-child(2){
	transform-origin: right bottom;
	transform: rotate(90deg);
	background: #C8A8E9;
	left: -10px;
	animation: zhankai1 10s infinite;
}
			
.petal:nth-child(3){
	width: 40px;
	height: 40px;
	left: 10px;
	top: -20px;
	z-index: 1;
	background: #DDA0DD;
	transform-origin: bottom right; 
	animation: zhankai2 10s infinite;
}
			
.petal:nth-child(4){
	transform: rotate(90deg);
	width: 40px;
	height: 40px;
	left: 0px;
	top: -20px;
	z-index: 1;
	background: #DDA0DD;
	transform-origin: bottom right; 
	animation: zhankai1 10s infinite;
}
			
.petal:nth-child(5){
	width: 50px;
	height: 50px;
	border-radius: 20px;
	left: 20px;
	top: -30px;
	z-index: 0;
	background: #734F96;
}
			
.leaf {
	position: absolute;
	top: 120px;
	left: -115px;
}
			
.stem {
	width: 240px;
	height: 40px;
	background: transparent;
	border: 8px solid #8ac78a;
	border-color: #77a377 transparent transparent transparent;
	border-radius: 50% 50%;
	transform: rotate(100deg);
}
			
.leafs {
	width: 50px;
	height: 40px;
	border-radius: 0px 50%;
	background: #77a377;
	position: absolute;
	top: 0;
	left: 100px;
	z-index: 49;
}
			
.leafs:nth-child(2){
	width: 40px;
	height: 20px;
	top: 40px;
	left: 140px;
	transform: rotate(120deg);
}
			
@keyframes yidon{
	50%{
		transform: translateY(35%);
		}
	100%{
		transform: translateY(40%);
		}
}
			
@keyframes zhankai1{
	50%{
		transform: rotate(110deg);
		}
	100%{
		transform: rotate(90deg);
		}
}
			
@keyframes zhankai2{
	50%{
		transform: rotate(-20deg);
		}
	100%{
		transform: rotate(0deg);
		}
}

	</style>
</head>

<body>
	<div class="container">
		<h1>Dear Hani,</h1>
		<p class="your-text">
			Let me take this moment to officially ask you, <br>
			Will you be my valentine?
		</p>

		<div class="center">
		<button class="clickMe" onclick="window.location.href='https://www.canva.com/design/DAG_BAsWpqk/An7Eayva9z8SPQhb9n1jXQ/edit?utm_content=DAG_BAsWpqk&utm_campaign=designshare&utm_medium=link2&utm_source=sharebutton'">Yes</button>
		
		<button class="clickMe" onclick="window.location.href='file:///C:/Users/COA/Desktop/Eli/why.html'">No</button>
		</div>
	</div>
	
	<div class="rose">
		<div class="flower">
			<div class="petal"></div>
			<div class="petal"></div>
			<div class="petal"></div>
			<div class="petal"></div>
			<div class="petal"></div>
		</div>
		<div class="leaf">
			<div class="stem"></div>
			<div class="leafs"></div>
			<div class="leafs"></div>
		</div>
	</div>


	<script>
		function createHeart() {
			const heart = document.createElement("div");
			heart.classList.add("heart");

			// random colors for hearts
			const colors = ["💜", "💙", "💕"];
			heart.innerHTML = colors[Math.floor(Math.random() * colors.length)];

			heart.style.left = Math.random() * 100 + "vw";
			heart.style.fontSize = Math.random() * 20 + 15 + "px";
			heart.style.animationDuration = Math.random() * 3 + 2 + "s";
			document.body.appendChild(heart);

			setTimeout(() => {
				heart.remove();
			}, 5000);
		}
		setInterval(createHeart, 400);
	</script>
</body>

</html>
